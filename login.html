<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastPark - Connexion</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Poppins',sans-serif;
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            min-height:100vh; display:flex;
            justify-content:center; align-items:center; overflow-x:hidden;
        }
        body::before {
            content:''; position:absolute;
            width:300px; height:300px;
            background:rgba(255,255,255,.08);
            border-radius:50%; top:-150px; left:-150px;
            animation:float 20s infinite;
        }
        body::after {
            content:''; position:absolute;
            width:400px; height:400px;
            background:rgba(255,255,255,.06);
            border-radius:50%; bottom:-200px; right:-200px;
            animation:float 25s infinite reverse;
        }
        @keyframes float {
            0%,100%{transform:translate(0,0) rotate(0deg)}
            50%     {transform:translate(30px,20px) rotate(10deg)}
        }
        .box {
            background:white; border-radius:28px;
            padding:50px 40px; width:90%; max-width:420px;
            box-shadow:0 30px 60px rgba(0,0,0,.3);
            position:relative; z-index:1;
            animation:slideUp .6s ease-out;
        }
        @keyframes slideUp {
            from{opacity:0;transform:translateY(30px)}
            to  {opacity:1;transform:translateY(0)}
        }
        .logo { text-align:center; margin-bottom:18px; }
        .logo i {
            font-size:56px;
            background:linear-gradient(135deg,#667eea,#764ba2);
            -webkit-background-clip:text; background-clip:text; color:transparent;
        }
        h1  { text-align:center; color:#333; font-weight:700; font-size:1.9em; margin-bottom:6px; }
        .sub { text-align:center; color:#888; margin-bottom:32px; font-size:.9em; }

        .input-group { position:relative; margin-bottom:18px; }
        .input-group i { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:#bbb; }
        input {
            width:100%; padding:13px 13px 13px 44px;
            border:2px solid #e8e8e8; border-radius:12px;
            font-size:1em; font-family:'Poppins',sans-serif;
            outline:none; transition:border .25s;
        }
        input:focus { border-color:#667eea; box-shadow:0 0 0 3px rgba(102,126,234,.1); }

        .err-msg {
            background:#ffebee; color:#c62828;
            padding:12px 14px; border-radius:10px;
            margin-bottom:18px; font-size:.88em;
            font-weight:500; border-left:4px solid #f44336;
            display:none;
        }
        .err-msg.show { display:block; }

        button {
            width:100%; padding:14px;
            background:linear-gradient(135deg,#667eea,#764ba2);
            color:white; border:none; border-radius:12px;
            font-size:1.05em; font-weight:600; cursor:pointer;
            font-family:'Poppins',sans-serif; margin-top:8px;
            transition:all .25s;
        }
        button:hover { transform:translateY(-2px); box-shadow:0 10px 20px rgba(102,126,234,.3); }
        button:disabled { opacity:.65; pointer-events:none; }

        .footer-info {
            background:#f5f7ff; border-radius:12px;
            padding:14px; margin-top:22px; text-align:center;
            font-size:.85em; color:#666;
        }
        .footer-info a { color:#667eea; text-decoration:none; font-weight:600; display:block; margin-top:4px; }
        .footer-info a:hover { color:#764ba2; }
    </style>
</head>
<body>
<div class="box">
    <div class="logo"><i class="fas fa-parking"></i></div>
    <h1>FastPark</h1>
    <div class="sub">Gestion de parking intelligente</div>

    <div class="err-msg" id="errMsg"></div>

    <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Nom d'utilisateur" autocomplete="username">
    </div>
    <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password">
    </div>

    <button id="loginBtn" onclick="doLogin()">
        <i class="fas fa-sign-in-alt"></i> Se connecter
    </button>

    <div class="footer-info">
        <a href="/register">
            <i class="fas fa-user-plus"></i> Créer un compte
        </a>
    </div>
</div>

<script>
    async function doLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const err      = document.getElementById('errMsg');
        const btn      = document.getElementById('loginBtn');

        err.className = 'err-msg';

        if (!username || !password) {
            err.textContent = 'Veuillez remplir tous les champs.';
            err.classList.add('show');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion…';

        try {
            const r = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ username, password })
            });
            const d = await r.json();

            if (d.success) {
                window.location.href = '/dashboard';
            } else {
                err.textContent = d.message || 'Identifiants incorrects.';
                err.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
            }
        } catch(e) {
            err.textContent = '❌ Impossible de joindre le serveur.';
            err.classList.add('show');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
        }
    }

    document.addEventListener('keypress', e => {
        if (e.key === 'Enter') doLogin();
    });
</script>
</body>
</html>
